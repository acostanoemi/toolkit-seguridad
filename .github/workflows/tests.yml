# CI del toolkit: corre todos los tests en un entorno limpio ante cada push.
# Instala todo lo que necesita alguna herramienta (cryptography, scapy, matplotlib)
# porque los tests importan el sniffer y el cifrador.
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest
      - name: Correr los tests
        run: pytest -v
